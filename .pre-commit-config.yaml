repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^(back/openapi\.json|front/src/api/types\.ts)$
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: (package-lock\.json|\.secrets\.baseline)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^back/
      - id: ruff-format
        files: ^back/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-c", "back/pyproject.toml", "-r"]
        files: ^back/app/
        additional_dependencies: ["bandit[toml]"]

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bash -c 'cd front && npx --no-install prettier --write --ignore-unknown "${@#front/}"' --
        language: system
        files: ^front/.*\.(ts|tsx|js|jsx|css|json|html)$
      - id: eslint
        name: eslint
        entry: bash -c 'cd front && npx --no-install eslint --fix "${@#front/}"' --
        language: system
        files: ^front/.*\.(ts|tsx|js|jsx)$

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
